<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="evBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181922" />
      <stop offset="100%" stop-color="#0f1015" />
    </linearGradient>
    <linearGradient id="evAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="evGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="250" rx="16" fill="url(#evBg)" />
  <circle cx="200" cy="125" r="90" fill="#10b981" opacity="0.05" />
  
  <ellipse cx="200" cy="195" rx="130" ry="12" fill="#000000" opacity="0.4" />
  
  <!-- Rear Wheel -->
  <circle cx="115" cy="168" r="32" fill="none" stroke="#2e303e" stroke-width="7" />
  <circle cx="115" cy="168" r="22" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5,4" />
  <circle cx="115" cy="168" r="10" fill="#3b3d4f" />

  <!-- Front Wheel -->
  <circle cx="285" cy="168" r="32" fill="none" stroke="#2e303e" stroke-width="7" />
  <circle cx="285" cy="168" r="22" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5,4" />
  <circle cx="285" cy="168" r="10" fill="#3b3d4f" />

  <!-- Modern Sharp EV Frame -->
  <path d="M 120,162 L 155,115 L 200,118 L 225,160 L 265,160 L 280,105 L 255,88" fill="none" stroke="url(#evAccent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#evGlow)" />
  
  <!-- Lightning Bolt Badge on Frame -->
  <path d="M 195,128 L 187,142 L 197,142 L 191,154 L 205,138 L 196,138 Z" fill="#10b981" filter="url(#evGlow)" />

  <!-- Seat -->
  <path d="M 130,112 L 195,114 L 190,123 L 135,120 Z" fill="#1e2029" />
  
  <!-- Handlebars -->
  <path d="M 255,88 L 245,80 L 232,83" fill="none" stroke="#9496a8" stroke-width="5" stroke-linecap="round" />
  <circle cx="258" cy="90" r="4" fill="#34d399" filter="url(#evGlow)" />
  
  <text x="200" y="230" text-anchor="middle" fill="#9496a8" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="1">ELECTRIC VEHICLE / E-SCOOTER</text>
</svg>

