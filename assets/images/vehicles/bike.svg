<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bikeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181922" />
      <stop offset="100%" stop-color="#0f1015" />
    </linearGradient>
    <linearGradient id="bikeAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="bikeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="250" rx="16" fill="url(#bikeBg)" />
  <circle cx="200" cy="125" r="90" fill="#a855f7" opacity="0.05" />
  
  <!-- Ground Shadow -->
  <ellipse cx="200" cy="195" rx="130" ry="12" fill="#000000" opacity="0.4" />
  
  <!-- Rear Wheel -->
  <circle cx="110" cy="165" r="38" fill="none" stroke="#2e303e" stroke-width="8" />
  <circle cx="110" cy="165" r="28" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="6,4" />
  <circle cx="110" cy="165" r="12" fill="#3b3d4f" />

  <!-- Front Wheel -->
  <circle cx="290" cy="165" r="38" fill="none" stroke="#2e303e" stroke-width="8" />
  <circle cx="290" cy="165" r="28" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="6,4" />
  <circle cx="290" cy="165" r="12" fill="#3b3d4f" />

  <!-- Frame & Body -->
  <path d="M 110,165 L 165,140 L 210,140 L 255,105 L 290,165" fill="none" stroke="#474a5e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 165,140 L 195,110 L 255,105" fill="none" stroke="url(#bikeAccent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#bikeGlow)" />
  
  <!-- Fuel Tank & Seat -->
  <path d="M 150,115 Q 185,100 220,105 L 245,115 L 225,128 L 155,125 Z" fill="url(#bikeAccent)" />
  <path d="M 130,122 Q 155,120 175,124 L 170,132 L 135,130 Z" fill="#1e2029" />
  
  <!-- Handlebars & Fork -->
  <path d="M 255,105 L 250,85 L 235,85" fill="none" stroke="#9496a8" stroke-width="5" stroke-linecap="round" />
  <circle cx="258" cy="98" r="4" fill="#38bdf8" filter="url(#bikeGlow)" />
  
  <!-- Exhaust -->
  <path d="M 175,150 L 140,168 L 105,170" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" />
  
  <text x="200" y="230" text-anchor="middle" fill="#9496a8" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="1">SPORT MOTORBIKE</text>
</svg>

