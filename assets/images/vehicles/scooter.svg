<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="scootBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181922" />
      <stop offset="100%" stop-color="#0f1015" />
    </linearGradient>
    <linearGradient id="scootAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="scootGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="250" rx="16" fill="url(#scootBg)" />
  <circle cx="200" cy="125" r="90" fill="#06b6d4" opacity="0.05" />
  
  <ellipse cx="200" cy="195" rx="130" ry="12" fill="#000000" opacity="0.4" />
  
  <!-- Rear Wheel -->
  <circle cx="115" cy="168" r="32" fill="none" stroke="#2e303e" stroke-width="7" />
  <circle cx="115" cy="168" r="22" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="5,4" />
  <circle cx="115" cy="168" r="10" fill="#3b3d4f" />

  <!-- Front Wheel -->
  <circle cx="285" cy="168" r="32" fill="none" stroke="#2e303e" stroke-width="7" />
  <circle cx="285" cy="168" r="22" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="5,4" />
  <circle cx="285" cy="168" r="10" fill="#3b3d4f" />

  <!-- Scooter Body Curved Fairing -->
  <path d="M 115,160 Q 125,120 160,118 L 205,120 L 220,158 L 265,158 L 278,110 L 255,90" fill="none" stroke="url(#scootAccent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#scootGlow)" />
  
  <!-- Floorboard -->
  <path d="M 180,160 L 235,160" stroke="#474a5e" stroke-width="6" stroke-linecap="round" />

  <!-- Seat -->
  <path d="M 130,115 Q 170,110 200,116 L 195,125 L 135,123 Z" fill="#1e2029" />
  
  <!-- Apron / Front Shield -->
  <path d="M 270,105 L 260,145 Q 265,155 278,155 L 285,135 Z" fill="url(#scootAccent)" />
  
  <!-- Handlebars & Headlight -->
  <path d="M 255,90 L 248,82 L 235,85" fill="none" stroke="#9496a8" stroke-width="5" stroke-linecap="round" />
  <circle cx="258" cy="92" r="5" fill="#38bdf8" filter="url(#scootGlow)" />
  
  <text x="200" y="230" text-anchor="middle" fill="#9496a8" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="1">CAMPUS SCOOTER</text>
</svg>

