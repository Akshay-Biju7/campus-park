<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="carBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181922" />
      <stop offset="100%" stop-color="#0f1015" />
    </linearGradient>
    <linearGradient id="carAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="carGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="250" rx="16" fill="url(#carBg)" />
  <circle cx="200" cy="125" r="90" fill="#f59e0b" opacity="0.05" />
  
  <ellipse cx="200" cy="195" rx="140" ry="12" fill="#000000" opacity="0.4" />
  
  <!-- Rear Wheel -->
  <circle cx="120" cy="170" r="28" fill="none" stroke="#2e303e" stroke-width="7" />
  <circle cx="120" cy="170" r="18" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3" />
  <circle cx="120" cy="170" r="9" fill="#3b3d4f" />

  <!-- Front Wheel -->
  <circle cx="280" cy="170" r="28" fill="none" stroke="#2e303e" stroke-width="7" />
  <circle cx="280" cy="170" r="18" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3" />
  <circle cx="280" cy="170" r="9" fill="#3b3d4f" />

  <!-- Car Body Outline -->
  <path d="M 70,165 
           L 85,145 
           L 130,140 
           L 165,100 
           L 245,100 
           L 285,138 
           L 325,142 
           L 330,165 
           L 305,165 
           A 28,28 0 0,0 255,165 
           L 145,165 
           A 28,28 0 0,0 95,165 
           Z" 
        fill="url(#carAccent)" filter="url(#carGlow)" />
  
  <!-- Windows -->
  <path d="M 168,107 L 200,107 L 200,136 L 140,136 Z" fill="#1e2029" />
  <path d="M 206,107 L 242,107 L 275,136 L 206,136 Z" fill="#1e2029" />

  <!-- Headlights -->
  <circle cx="323" cy="148" r="4" fill="#fef08a" />
  <circle cx="75" cy="148" r="3" fill="#ef4444" />
  
  <text x="200" y="230" text-anchor="middle" fill="#9496a8" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="1">FOUR-WHEELER / SEDAN</text>
</svg>

